    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = type;
      status.style.display = 'block';
    }

    function addLog(message, isError = false) {
      const log = document.getElementById('log');
      log.style.display = 'block';
      const entry = document.createElement('div');
      entry.className = `log-entry ${isError ? 'log-error' : 'log-success'}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    window.signIn = async function() {
      const email = prompt('Enter your email:', 'rajathclans12@gmail.com');
      const password = prompt('Enter your password:');
      
      if (!email || !password) {
        showStatus('Sign in cancelled', 'error');
        return;
      }

      try {
        showStatus('Signing in...', 'info');
        await signInWithEmailAndPassword(auth, email, password);
        showStatus('Signed in successfully!', 'success');
      } catch (error) {
        showStatus(`Sign in failed: ${error.message}`, 'error');
        addLog(`Sign in failed: ${error.message}`, true);
      }
    };

    window.addReports = async function() {
      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = 'Adding reports...';
      showStatus('Starting to add fake reports...', 'info');
      addLog('Starting to add fake reports...');

      try {
        const user = auth.currentUser;
        if (!user) {
          throw new Error('Not authenticated');
        }

        for (let i = 0; i < fakeReports.length; i++) {
          const report = fakeReports[i];
          
          const reportData = {
            ...report,
            createdAt: Timestamp.now(),
            updatedAt: Timestamp.now(),
            submittedDate: new Date().toISOString(),
            imageUrl: null,
            comments: [],
            createdBy: {
              uid: user.uid,
              displayName: user.displayName || report.citizenName,
              email: user.email || report.citizenEmail,
              photoURL: user.photoURL || null
            }
          };
          
          const docRef = await addDoc(collection(db, 'grievances'), reportData);
          addLog(`✓ Added report ${i + 1}/${fakeReports.length}: "${report.title}" (ID: ${docRef.id})`);
          showStatus(`Added ${i + 1}/${fakeReports.length} reports...`, 'info');
        }
        
        showStatus(`✅ Successfully added all ${fakeReports.length} fake reports!`, 'success');
        addLog(`✅ Successfully added all ${fakeReports.length} fake reports!`);
        btn.textContent = '✅ Reports Added Successfully';
        
      } catch (error) {
        showStatus(`❌ Error: ${error.message}`, 'error');
        addLog(`❌ Error: ${error.message}`, true);
        btn.disabled = false;
        btn.textContent = 'Try Again';
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('add-section').style.display = 'block';
        addLog(`Signed in as: ${user.email}`);
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('add-section').style.display = 'none';
      }
    });

    window.auth = auth;
    window.db = db;
